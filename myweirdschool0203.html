<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Weird School #4-6,7 The Chocolate Party</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#68738a;--paper:#fff;--line:rgba(23,32,51,.09);--shadow:0 5px 14px rgba(43,52,89,.08)}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:linear-gradient(145deg,#f7f4ff,#eefaff 48%,#fff8ed)}button{font:inherit}.page-shell{width:min(100% - 32px,1040px);margin:auto;padding:52px 0 72px}.hero{margin-bottom:34px;text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:7px 12px;border:1px solid rgba(101,79,226,.13);border-radius:999px;color:#6550d9;background:rgba(255,255,255,.72);font-size:.78rem;font-weight:800;letter-spacing:.12em}.eyebrow:before{width:8px;height:8px;border-radius:50%;background:#ff5e99;box-shadow:0 0 0 4px rgba(255,94,153,.13);content:""}h1{margin:0;font-size:clamp(2rem,6vw,3.8rem);line-height:1.08;letter-spacing:-.055em}.subtitle{margin:13px 0 0;color:var(--muted);font-size:clamp(.95rem,2vw,1.08rem)}.book-list{display:grid;gap:24px}.book-card{overflow:hidden;border:1px solid rgba(255,255,255,.9);border-radius:32px;background:rgba(255,255,255,.64);box-shadow:var(--shadow)}.book-head{display:flex;width:100%;align-items:center;justify-content:space-between;padding:24px clamp(20px,4vw,32px);border:0;color:#fff;background:linear-gradient(120deg,#6550d9,#a056df 55%,#ef4f8f);font-size:clamp(1.35rem,4vw,1.8rem);font-weight:900;text-align:left;cursor:pointer}.book-head:focus-visible{outline:4px solid rgba(116,88,232,.3);outline-offset:4px}.book-toggle{display:grid;width:38px;height:38px;place-items:center;border-radius:50%;background:rgba(255,255,255,.2);font-size:1.35rem;line-height:1}.book-content{padding:24px}.book-content[hidden]{display:none}.book-empty{margin:0;padding:30px;border:2px dashed rgba(101,80,217,.2);border-radius:20px;color:var(--muted);text-align:center;font-weight:700}.unit-list{display:grid;gap:24px}.unit-card{position:relative;overflow:hidden;padding:clamp(20px,4vw,32px);border:1px solid rgba(255,255,255,.88);border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}.unit-head{position:relative;z-index:1;display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;margin:0;padding:0;border:0;color:inherit;background:transparent;text-align:left;cursor:pointer}.unit-head[aria-expanded="true"]{margin-bottom:18px}.unit-title{margin:0;font-size:clamp(1.15rem,3vw,1.5rem);font-weight:800}.unit-meta{display:flex;align-items:center;gap:10px}.unit-count{padding:7px 11px;border-radius:999px;color:var(--accent);background:var(--soft);font-size:.78rem;font-weight:800}.toggle-icon{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;color:#fff;background:var(--accent);font-size:1.25rem;font-weight:700;line-height:1;transition:transform .18s}.unit-head:hover .toggle-icon{transform:scale(1.08)}.unit-head:focus-visible{outline:4px solid var(--focus);outline-offset:8px;border-radius:8px}.number-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(9px,1.8vw,14px)}.number-grid[hidden]{display:none}.word-button{position:relative;min-height:clamp(62px,9vw,78px);border:1px solid var(--line);border-radius:18px;color:var(--ink);background:rgba(255,255,255,.94);box-shadow:0 2px 6px rgba(31,45,84,.06);font-size:clamp(1rem,2.7vw,1.28rem);font-weight:900;cursor:pointer;transition:background-color .12s,color .12s;-webkit-tap-highlight-color:transparent}.word-button:before{position:absolute;top:9px;left:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.7;content:""}.word-button:hover{border-color:transparent;color:#fff;background:var(--accent);box-shadow:0 13px 23px var(--button-shadow)}.word-button:hover:before,.word-button.is-speaking:before{background:#fff}.word-button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.word-button.is-speaking{color:#fff;border-color:transparent;background:var(--accent);box-shadow:0 0 0 5px var(--soft),0 13px 23px var(--button-shadow);}.unit-card:nth-child(6n + 1){--accent:#7458e8;--soft:#eeeaff;--glow:#7458e8;--button-shadow:rgba(116,88,232,.28);--focus:rgba(116,88,232,.22)}.unit-card:nth-child(6n + 2){--accent:#ef4f8f;--soft:#ffe8f1;--glow:#ef4f8f;--button-shadow:rgba(239,79,143,.28);--focus:rgba(239,79,143,.22)}.unit-card:nth-child(6n + 3){--accent:#0da98a;--soft:#e1f8f2;--glow:#0da98a;--button-shadow:rgba(13,169,138,.26);--focus:rgba(13,169,138,.2)}.unit-card:nth-child(6n + 4){--accent:#ef812c;--soft:#fff0e2;--glow:#ef812c;--button-shadow:rgba(239,129,44,.27);--focus:rgba(239,129,44,.22)}.unit-card:nth-child(6n + 5){--accent:#2c83dd;--soft:#e5f2ff;--glow:#2c83dd;--button-shadow:rgba(44,131,221,.27);--focus:rgba(44,131,221,.21)}.unit-card:nth-child(6n){--accent:#db5b47;--soft:#ffebe7;--glow:#db5b47;--button-shadow:rgba(219,91,71,.27);--focus:rgba(219,91,71,.21)}.toast{position:fixed;left:50%;bottom:24px;z-index:10;max-width:calc(100% - 32px);padding:11px 17px;border-radius:999px;color:#fff;background:rgba(23,32,51,.91);box-shadow:0 12px 28px rgba(23,32,51,.2);font-size:.88rem;font-weight:750;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.page-shell{width:min(100% - 20px,1040px);padding-top:34px}.unit-card{border-radius:22px}.number-grid{gap:8px}.word-button{min-height:56px;border-radius:14px}.unit-count{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}@media print{body{background:#fff}.page-shell{width:100%;padding:0}.unit-card{break-inside:avoid;box-shadow:none;background:#fff}.word-button{min-height:45px;box-shadow:none}.toast{display:none}}
</style></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">LISTENING PRACTICE</p><h1>My Weird School #4-6,7 The Chocolate Party</h1><p class="subtitle">한글 뜻을 누르고 영어 발음을 들어 보세요.</p></header><div class="book-list"><section class="book-card"><div class="book-head"><span>Book 4 &middot; Chapters 6&ndash;7</span></div><div class="book-content" id="lessonContent"><div class="unit-list" id="testList"></div></div></section></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const tests=[
{test:1,items:[['put a tack on','압정을 놓았다'],["Miss Daisy's chair",'데이지 선생님의 의자에'],['during class','수업 중에'],['one day','어느 날'],["Ryan put a tack on Miss Daisy's chair during class one day.",'어느 날 라이언은 수업 중에 데이지 선생님의 의자에 압정을 놓았습니다.']]},
{test:2,items:[['saw the tack','압정을 보았다'],['on her skirt','그녀의 치마에 붙은'],['and tried','그리고 애썼다'],['not to laugh','웃지 않으려고'],['We saw the tack on her skirt and tried not to laugh.','우리는 그녀의 치마에 붙은 압정을 보고 웃지 않으려고 애썼습니다.']]},
{test:3,items:[['Andrea told','앤드리아가 말했다'],['Miss Daisy','데이지 선생님에게'],['about it','그것에 관해'],['got ery mad','매우 화가 났다'],['Andrea told Miss Daisy about it, and Miss Daisy got very mad.','앤드리아가 데이지 선생님에게 그것을 말했고, 데이지 선생님은 매우 화가 났습니다.']]},
{test:4,items:[['then','그러고 나서'],['sent Ryan','라이언을 보냈다'],['straight to','곧장 ~에게'],['in his office','그의 사무실에 있는'],['Miss Daisy then sent Ryan straight to Mr Klutz in his office.','데이지 선생님은 그러고 나서 라이언을 교장실에 있는 클러츠 교장 선생님에게 곧장 보냈습니다.']]}];const toast=document.getElementById('toast');let activeButton=null,toastTimer=null;
function renderTests(){const list=document.getElementById('testList'),fragment=document.createDocumentFragment();tests.forEach(({test,items})=>{const section=document.createElement('section');section.className='unit-card';const header=document.createElement('div');header.className='unit-head';header.innerHTML=`<span class="unit-title">TEST ${test}</span><span class="unit-meta"><span class="unit-count">${items.length} ITEMS</span></span>`;const grid=document.createElement('div');grid.className='number-grid';items.forEach(([english,korean])=>{const button=document.createElement('button');button.className='word-button';button.type='button';button.textContent=korean;button.title=english;button.dataset.speech=english;button.setAttribute('aria-label',english);button.addEventListener('click',()=>speak(button.dataset.speech,button),{passive:true});grid.appendChild(button)});section.append(header,grid);fragment.appendChild(section)});list.appendChild(fragment)}renderTests();
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('is-visible');toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1500)}
function clearActiveButton(){if(activeButton)activeButton.classList.remove('is-speaking');activeButton=null}
function getEnglishVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>/^en-US$/i.test(v.lang)&&/natural|google|samantha|zira|microsoft/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}
function speak(text,button){if(!('speechSynthesis' in window)){showToast('이 브라우저에서는 음성 재생을 지원하지 않습니다.');return}speechSynthesis.cancel();clearActiveButton();activeButton=button;button.classList.add('is-speaking');let played=false;const play=()=>{if(played)return;played=true;const utterance=new SpeechSynthesisUtterance(text);const voice=getEnglishVoice();utterance.lang=voice?.lang||'en-US';utterance.voice=voice;utterance.rate=.7;utterance.onend=clearActiveButton;utterance.onerror=e=>{clearActiveButton();if(!['canceled','interrupted'].includes(e.error))showToast('음성을 재생하지 못했습니다.')};speechSynthesis.speak(utterance)};if(speechSynthesis.getVoices().length){play()}else{speechSynthesis.addEventListener('voiceschanged',play,{once:true});setTimeout(play,500)}}
addEventListener('beforeunload',()=>speechSynthesis?.cancel());
</script></body></html>

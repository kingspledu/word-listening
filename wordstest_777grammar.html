const toast=document.getElementById("toast");let activeButton=null,toastTimer=null,speechToken=0,cachedVoice=null;const twoDigits=n=>String(n).padStart(2,"0");
document.querySelectorAll(".book-head").forEach((header,index)=>header.addEventListener("click",()=>{const content=document.getElementById(header.getAttribute("aria-controls")),willOpen=header.getAttribute("aria-expanded")!=="true",bookKey="book"+(index+1);if(willOpen&&!content.dataset.rendered){renderUnits(books[bookKey],bookKey+"UnitList",bookKey);content.dataset.rendered="true"}header.setAttribute("aria-expanded",String(willOpen));header.querySelector(".book-toggle").textContent=willOpen?"−":"＋";content.hidden=!willOpen;if(!willOpen)cancelSpeech()}));
function renderUnits(units,listId,bookKey){const list=document.getElementById(listId),fragment=document.createDocumentFragment();units.forEach(({unit,title,labels,words})=>{const key=bookKey+"-"+unit,section=document.createElement("section");section.className="unit-card";const header=document.createElement("button");header.className="unit-head";header.type="button";header.id="unit-"+key;header.setAttribute("aria-expanded","false");header.setAttribute("aria-controls","grid-"+key);header.innerHTML=`<span class="unit-title">${title||`UNIT ${unit}`}</span><span class="unit-meta"><span class="unit-count">${words.length} ITEMS</span><span class="toggle-icon" aria-hidden="true">＋</span></span>`;const grid=document.createElement("div");grid.className="number-grid";grid.id="grid-"+key;grid.hidden=true;grid.setAttribute("aria-labelledby",header.id);words.forEach((word,index)=>{const button=document.createElement("button");button.className="word-button";button.type="button";const label=labels?.[index]||twoDigits(index+1);button.textContent=label;button.setAttribute("aria-label",label+"번 발음 듣기");button._word=word;grid.appendChild(button)});section.append(header,grid);fragment.appendChild(section)});list.appendChild(fragment);list.addEventListener("click",event=>{const wordButton=event.target.closest(".word-button");if(wordButton){speak(wordButton._word,wordButton);return}const unitHeader=event.target.closest(".unit-head");if(unitHeader)toggleUnit(unitHeader,document.getElementById(unitHeader.getAttribute("aria-controls")))})}

function toggleUnit(selectedHeader,selectedGrid){const willOpen=selectedHeader.getAttribute("aria-expanded")!=="true";cancelSpeech();document.querySelectorAll(".unit-head").forEach(header=>{header.setAttribute("aria-expanded","false");header.querySelector(".toggle-icon").textContent="＋"});document.querySelectorAll(".number-grid").forEach(grid=>grid.hidden=true);if(willOpen){selectedHeader.setAttribute("aria-expanded","true");selectedHeader.querySelector(".toggle-icon").textContent="−";selectedGrid.hidden=false;requestAnimationFrame(()=>selectedHeader.closest(".unit-card").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce),(pointer: coarse)").matches?"auto":"smooth",block:"start"}))}}
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add("is-visible");toastTimer=setTimeout(()=>toast.classList.remove("is-visible"),1500)}function clearActiveButton(){if(activeButton)activeButton.classList.remove("is-speaking");activeButton=null}
function cancelSpeech(){speechToken++;if("speechSynthesis" in window)window.speechSynthesis.cancel();clearActiveButton()}function chooseVoice(){const voices=window.speechSynthesis.getVoices();cachedVoice=voices.find(v=>/^en-US$/i.test(v.lang)&&/natural|google|samantha|zira/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}if("speechSynthesis" in window){chooseVoice();window.speechSynthesis.onvoiceschanged=chooseVoice}
function speak(text,button){if(!("speechSynthesis" in window)){showToast("이 브라우저에서는 음성 재생을 지원하지 않습니다.");return}cancelSpeech();const token=speechToken;activeButton=button;button.classList.add("is-speaking");setTimeout(()=>{if(token!==speechToken)return;const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.7;utterance.pitch=1;utterance.volume=1;if(cachedVoice)utterance.voice=cachedVoice;utterance.onend=()=>{if(token===speechToken)clearActiveButton()};utterance.onerror=e=>{if(token===speechToken)clearActiveButton();if(e.error!=="canceled"&&e.error!=="interrupted")showToast("음성을 재생하지 못했습니다.")};window.speechSynthesis.speak(utterance)},40)}window.addEventListener("beforeunload",cancelSpeech);
</script></body></html>

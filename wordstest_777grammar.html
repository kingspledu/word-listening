<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIT Word Listening</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#68738a;--paper:rgba(255,255,255,.88);--line:rgba(23,32,51,.09);--shadow:0 18px 45px rgba(43,52,89,.12)}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,rgba(255,105,180,.22),transparent 28rem),radial-gradient(circle at 90% 10%,rgba(47,199,255,.22),transparent 30rem),linear-gradient(145deg,#f7f4ff,#eefaff 48%,#fff8ed)}button{font:inherit}.page-shell{width:min(100% - 32px,1040px);margin:auto;padding:52px 0 72px}.hero{margin-bottom:34px;text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:7px 12px;border:1px solid rgba(101,79,226,.13);border-radius:999px;color:#6550d9;background:rgba(255,255,255,.72);font-size:.78rem;font-weight:800;letter-spacing:.12em}.eyebrow:before{width:8px;height:8px;border-radius:50%;background:#ff5e99;box-shadow:0 0 0 4px rgba(255,94,153,.13);content:""}h1{margin:0;font-size:clamp(2rem,6vw,3.8rem);line-height:1.08;letter-spacing:-.055em}.subtitle{margin:13px 0 0;color:var(--muted);font-size:clamp(.95rem,2vw,1.08rem)}.unit-list{display:grid;gap:24px}.unit-card{position:relative;overflow:hidden;padding:clamp(20px,4vw,32px);border:1px solid rgba(255,255,255,.88);border-radius:28px;background:var(--paper);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.unit-card:after{position:absolute;top:-55px;right:-45px;width:150px;height:150px;border-radius:50%;background:var(--glow);opacity:.13;content:"";pointer-events:none}.unit-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.unit-title{margin:0;font-size:clamp(1.15rem,3vw,1.5rem)}.unit-count{padding:7px 11px;border-radius:999px;color:var(--accent);background:var(--soft);font-size:.78rem;font-weight:800}.number-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(9px,1.8vw,14px)}.word-button{position:relative;min-height:clamp(62px,9vw,78px);border:1px solid var(--line);border-radius:18px;color:var(--ink);background:rgba(255,255,255,.94);box-shadow:0 7px 15px rgba(31,45,84,.07);font-size:clamp(1rem,2.7vw,1.28rem);font-weight:900;cursor:pointer;transition:.16s;-webkit-tap-highlight-color:transparent}.word-button:before{position:absolute;top:9px;left:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.7;content:""}.word-button:hover{transform:translateY(-3px);border-color:transparent;color:#fff;background:var(--accent);box-shadow:0 13px 23px var(--button-shadow)}.word-button:hover:before,.word-button.is-speaking:before{background:#fff}.word-button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.word-button.is-speaking{color:#fff;border-color:transparent;background:var(--accent);box-shadow:0 0 0 5px var(--soft),0 13px 23px var(--button-shadow);animation:pulse .9s ease-in-out infinite alternate}.unit-card:nth-child(6n + 1){--accent:#7458e8;--soft:#eeeaff;--glow:#7458e8;--button-shadow:rgba(116,88,232,.28);--focus:rgba(116,88,232,.22)}.unit-card:nth-child(6n + 2){--accent:#ef4f8f;--soft:#ffe8f1;--glow:#ef4f8f;--button-shadow:rgba(239,79,143,.28);--focus:rgba(239,79,143,.22)}.unit-card:nth-child(6n + 3){--accent:#0da98a;--soft:#e1f8f2;--glow:#0da98a;--button-shadow:rgba(13,169,138,.26);--focus:rgba(13,169,138,.2)}.unit-card:nth-child(6n + 4){--accent:#ef812c;--soft:#fff0e2;--glow:#ef812c;--button-shadow:rgba(239,129,44,.27);--focus:rgba(239,129,44,.22)}.unit-card:nth-child(6n + 5){--accent:#2c83dd;--soft:#e5f2ff;--glow:#2c83dd;--button-shadow:rgba(44,131,221,.27);--focus:rgba(44,131,221,.21)}.unit-card:nth-child(6n){--accent:#db5b47;--soft:#ffebe7;--glow:#db5b47;--button-shadow:rgba(219,91,71,.27);--focus:rgba(219,91,71,.21)}.toast{position:fixed;left:50%;bottom:24px;z-index:10;max-width:calc(100% - 32px);padding:11px 17px;border-radius:999px;color:#fff;background:rgba(23,32,51,.91);box-shadow:0 12px 28px rgba(23,32,51,.2);font-size:.88rem;font-weight:750;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}@keyframes pulse{to{transform:scale(1.025)}}@media(max-width:520px){.page-shell{width:min(100% - 20px,1040px);padding-top:34px}.unit-card{border-radius:22px}.number-grid{gap:8px}.word-button{min-height:56px;border-radius:14px}.unit-count{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}@media print{body{background:#fff}.page-shell{width:100%;padding:0}.unit-card{break-inside:avoid;box-shadow:none;background:#fff}.word-button{min-height:45px;box-shadow:none}.toast{display:none}}
</style></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">LISTENING PRACTICE</p><h1>Tap &amp; Listen</h1><p class="subtitle">번호를 누르고 발음을 들어 보세요.</p></header><div class="unit-list" id="unitList"></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const units=[
{unit:"01",words:["handsome","play","clean","glasses","wear","meet","many","read","sing","song","soccer","cute","pretty","make","cookie","sleep","fruit","take a bus","rise","cook","dinner"]},
{unit:"06",words:["puppy","street","live","parents","pencil case","call","last night","picture","together","smile at","touch","help","know","plan","want","belt","give","size","necklace","music","very much","write","movie","funny","every day","remember"]},
{unit:"07",words:["late","cousin","good","people","shoes","mistake","newspaper","spoon","delicious","pants","present","nice","scarf","melon","grandparents","photo"]},
{unit:"08",words:["home","kind","heavy","rich","same","yellow","angry","now","busy","hungry","aunt","thirsty","American","warm","today","diligent","Korean","surprise","hospital"]},
{unit:"09",words:["baseball","fast","work","well","hard","have lunch","floor","shopping","at night","drink","always","win","think","vacation","enjoy","basketball","say","vase","break","chopsticks","use","model airplane","draw","cold","homework","cloud","sick","hear","strange","sound"]},
{unit:"10",words:["here","weather","walk","slowly","visit","fix","try","restaurant","alone","loudly","laundry","pay","own","store","brush","finish","get up","middle school","a.m.","sandwich","p.m.","sell","travel","bookstore","fly","shine"]}
];
const unitList=document.getElementById("unitList"),toast=document.getElementById("toast");let activeButton=null,toastTimer=null;const twoDigits=n=>String(n).padStart(2,"0");
units.forEach(({unit,words})=>{const section=document.createElement("section");section.className="unit-card";section.setAttribute("aria-labelledby",`unit-${unit}`);const header=document.createElement("div");header.className="unit-head";header.innerHTML=`<h2 class="unit-title" id="unit-${unit}">UNIT ${unit}</h2><span class="unit-count">${words.length} ITEMS</span>`;const grid=document.createElement("div");grid.className="number-grid";words.forEach((word,index)=>{const button=document.createElement("button");button.className="word-button";button.type="button";button.textContent=twoDigits(index+1);button.setAttribute("aria-label",`${index+1}번 발음 듣기`);button.addEventListener("click",()=>speak(word,button));grid.appendChild(button)});section.append(header,grid);unitList.appendChild(section)});
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add("is-visible");toastTimer=setTimeout(()=>toast.classList.remove("is-visible"),1500)}function clearActiveButton(){if(activeButton)activeButton.classList.remove("is-speaking");activeButton=null}
function speak(text,button){if(!("speechSynthesis" in window)){showToast("이 브라우저에서는 음성 재생을 지원하지 않습니다.");return}window.speechSynthesis.cancel();clearActiveButton();activeButton=button;button.classList.add("is-speaking");const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.82;utterance.pitch=1;utterance.volume=1;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>/^en-US$/i.test(v.lang)&&/natural|google|samantha|zira/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)utterance.voice=voice;utterance.onend=clearActiveButton;utterance.onerror=e=>{clearActiveButton();if(e.error!=="canceled"&&e.error!=="interrupted")showToast("음성을 재생하지 못했습니다.")};window.speechSynthesis.speak(utterance)}window.addEventListener("beforeunload",()=>{"speechSynthesis" in window&&window.speechSynthesis.cancel()});
</script></body></html>
